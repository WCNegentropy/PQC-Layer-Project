[package]
name = "aegis-crypto-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.aegis-crypto]
path = ".."

[[bin]]
name = "fuzz_kem_deser"
path = "fuzz_targets/fuzz_kem_deser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_aead_decrypt"
path = "fuzz_targets/fuzz_aead_decrypt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_sig_verify"
path = "fuzz_targets/fuzz_sig_verify.rs"
test = false
doc = false
bench = false
